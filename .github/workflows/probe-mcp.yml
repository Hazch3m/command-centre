name: Probe Claude connector
on:
  push:
    paths: [".github/workflows/probe-mcp.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request as Claude's connector would (fake key)
        run: |
          Z64=$(printf '0%.0s' $(seq 64)); Z48=$(printf '0%.0s' $(seq 48))
          for ua in "python-httpx/0.28.1" "Claude-User/1.0" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; Claude-User/1.0; +Claude-User@anthropic.com)" "ClaudeBot/1.0" "anthropic-mcp-client/1.0"; do
            for host in https://pacelife.run https://command-centre-sync.harryknoblauch12.workers.dev; do
              code=$(curl -sS -m 30 -o /tmp/b -w '%{http_code}' -X POST "$host/api/mcp/$Z64/$Z48" -H 'content-type: application/json' -H "user-agent: $ua" -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}')
              echo "RESULT $host [$ua] -> $code $(head -c 90 /tmp/b | tr -d '\n')"
            done
          done
