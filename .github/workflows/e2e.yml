name: phone e2e

on:
  push:
    branches: [e2e]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-audit --no-fund && npm i -g tsx
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      - name: Types (shown, not blocking)
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | head -60
      - name: Builds (PC preview and phone)
        run: |
          npx vite build --mode browser --outDir /tmp/pv --base ./
          npm run build:phone && cp -r cloud/public /tmp/ppv
      - name: Builds to the e2e-dist branch (to try layouts against, without a rebuild)
        if: always()
        run: |
          rm -rf /tmp/dist && mkdir -p /tmp/dist && cp -r /tmp/pv /tmp/dist/pv && cp -r /tmp/ppv /tmp/dist/ppv
          cd /tmp/dist
          git init -q -b e2e-dist
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Builds of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" e2e-dist
      - name: Fixtures dated to today
        run: |
          mkdir -p /tmp/fix && cp e2e/fixtures/* /tmp/fix/
          python3 - <<'PY'
          import json, datetime as dt
          p = "/tmp/fix/garmin.json"; f = json.load(open(p))
          acts = f["/activitylist-service/activities/search/activities"]
          last = max(dt.datetime.fromisoformat(a["startTimeLocal"]) for a in acts)
          shift = dt.date.today() - last.date()
          for a in acts:
              for k in ("startTimeLocal", "startTimeGMT"):
                  if a.get(k): a[k] = (dt.datetime.fromisoformat(a[k]) + shift).strftime("%Y-%m-%d %H:%M:%S")
          # Keep the newest run earlier today so it's never "in the future".
          json.dump(f, open(p, "w"))
          print("shifted by", shift)
          PY
      - run: e2e/emu/make-shim.sh
      - name: Phone end to end
        env:
          FIX: /tmp/fix
        run: python e2e/review_test.py /tmp/pv /tmp/ppv e2e-out
      - name: A brand-new user, end to end
        if: always()
        env:
          FIX: /tmp/fix
        run: python e2e/newuser_test.py /tmp/pv /tmp/ppv e2e-out/new
      - name: Screenshots to the e2e-shots branch
        if: always()
        run: |
          cd e2e-out
          git init -q -b e2e-shots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Shots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" e2e-shots
