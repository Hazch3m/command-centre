name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # UI-only build (in-browser SQLite) pushed to the `preview` branch, used to test
  # the interface in a headless browser before shipping the installer.
  browser-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash ci/run.sh "Unit tests (fast)" npm test
      - run: bash ci/run.sh "Type check (fast)" npx tsc --noEmit
      - run: bash ci/run.sh "Preview build" npx vite build --mode browser --outDir preview-dist --base ./
      - name: Push to preview branch
        run: |
          cd preview-dist
          git init -q -b preview
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Preview of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" preview

  # The phone app, and (once Cloudflare is set up) the sync service that serves it.
  phone:
    needs: browser-preview
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash ci/run.sh "Phone build" npm run build:phone
      - name: Push to phone-preview branch
        run: |
          cp -r cloud/public phone-dist
          cd phone-dist
          git init -q -b phone-preview
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Phone app of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" phone-preview
      - name: Deploy the sync service to Cloudflare
        if: env.HAS_CF == 'true'
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          npm install --no-audit --no-fund
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          # Google sign-in for accounts (a "Web application" OAuth client), when its secrets are set.
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID >/dev/null
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET >/dev/null
            echo "Google sign-in configured"
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Sync service address::${url:-see the deploy log}"
          # A whole account sync, run on Cloudflare itself (SQLite, tables, encryption, a phone change).
          if [ -n "$url" ]; then
            for i in 1 2 3; do curl -s -m 60 "$url/api/selftest" > selftest.json && break; sleep 5; done
            cat selftest.json; echo
            grep -q '"ok":true' selftest.json || { echo "::error title=Sync service self-test failed::$(head -c 600 selftest.json)"; exit 1; }
          fi
      - name: Cloudflare not set up yet
        if: env.HAS_CF != 'true'
        run: echo "::notice title=Phone sync::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the sync service."

  # The Windows installer costs the most build time, so it's made only when asked:
  # run this workflow by hand, or put [installer] in the commit message.
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[installer]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        shell: bash
        run: ci/run.sh "Frontend tests" npm test

      - name: Type check
        if: success() || failure()
        shell: bash
        run: ci/run.sh "Type check" npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: MCP SDK for the Watch module's end-to-end test
        shell: bash
        run: python -m pip install --quiet "mcp>=1.10"

      - name: Backend tests
        if: success() || failure()
        shell: bash
        run: ci/run.sh "Backend tests" cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        shell: bash
        run: ci/run.sh "Installer build" npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: CommandCentre-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Rolling pre-release so the newest installer is always one click away.
      - name: Publish installer to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest src-tauri/target/release/bundle/nsis/*.exe \
            --prerelease --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built automatically from ${GITHUB_SHA}."
