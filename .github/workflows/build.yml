name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        shell: bash
        run: ci/run.sh "Frontend tests" npm test

      - name: Type check
        if: success() || failure()
        shell: bash
        run: ci/run.sh "Type check" npx tsc --noEmit

      - name: Backend tests
        if: success() || failure()
        shell: bash
        run: ci/run.sh "Backend tests" cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        shell: bash
        run: ci/run.sh "Installer build" npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: CommandCentre-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Rolling pre-release so the newest installer is always one click away.
      - name: Publish installer to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest src-tauri/target/release/bundle/nsis/*.exe \
            --prerelease --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built automatically from ${GITHUB_SHA}."
