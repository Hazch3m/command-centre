name: iPhone app

# Builds the native iPhone app and sends it to TestFlight. The app shows the
# phone app the sync service serves, so web changes reach it without a new
# build; this only needs running when mobile/ changes (or by hand).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios.yml"]

concurrency: { group: ios, cancel-in-progress: false }

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.hazch3m.commandcentre
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple secrets are set
        run: |
          missing=""
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub secrets first (Settings → Secrets and variables → Actions): APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8, APPLE_TEAM_ID. Missing:$missing"
            exit 1
          fi

      - name: App Store Connect (bundle ID, app record)
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          python3 asc.py "$BUNDLE_ID"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Make the Xcode project
        run: |
          npm install --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          set -x
          A=ios/App/App
          for f in $A/Assets.xcassets/AppIcon.appiconset/*.png; do cp assets/icon-1024.png "$f"; done
          for f in $A/Assets.xcassets/Splash.imageset/*.png; do cp assets/splash-2732.png "$f"; done
          P=$A/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "$1" "$P"; }
          pb "Add :ITSAppUsesNonExemptEncryption bool false"
          # Lets the phone app's offline cache (its service worker) run inside the app.
          pb "Add :WKAppBoundDomains array"
          pb "Add :WKAppBoundDomains:0 string command-centre-sync.harryknoblauch12.workers.dev"
          pb "Delete :UISupportedInterfaceOrientations" || true
          pb "Add :UISupportedInterfaceOrientations array"
          pb "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait"
          pb "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" || true
          pb "Add :UIViewControllerBasedStatusBarAppearance bool false" || pb "Set :UIViewControllerBasedStatusBarAppearance false"

      - name: Build and sign
        run: |
          mkdir -p ~/private_keys
          KEY="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::The build failed (see the log above)"; exit 1; }

      - name: Send to TestFlight
        run: |
          KEY="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Build ${{ github.run_number }} sent. It shows in TestFlight once Apple has processed it (usually 5–15 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Tidy up the key
        if: always()
        run: rm -rf ~/private_keys
