# Command Centre sync service: stores the PC's encrypted snapshot and the
# phone's encrypted changes, and serves the phone app. It can't read either.
name = "command-centre-sync"
main = "src/worker.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# The app's own sync code runs in the service (cloud sync): it asks for "@backend".
[alias]
"@backend" = "./src/appBackend.ts"
