[package]
name = "command-centre"
version = "0.1.0"
description = "Personal command centre dashboard for a second monitor"
edition = "2021"

[lib]
name = "command_centre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "process", "rt"] }
# Official MCP SDK: the Watch module talks to the user's garmin-coach server over stdio.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
